[package]
name = "bloom-core"
version = "0.1.2"
edition = "2021"
authors = ["Michel Smola <dev@michelsmola.de>"]
license = "MIT"
description = "A react-like framework for descriptive UIs. Renderer Agnostic but built with HTML in mind."
repository = "https://github.com/mismosmi/bloom/tree/main/bloom-core"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
futures-util = { version = "0.3.34", features = ["channel"] }
async-trait = "0.1.92"
async-context = { version = "0.1.0", path = "../async-context" }
async-channel = "2.5.0"
pin-project = "1.1.13"
bloom-macro = { version = "0.1.0", path = "../bloom-macro" }

[dev-dependencies]
bloom-html = { path = "../bloom-html" }
bloom-rsx = { path = "../bloom-rsx" }
bloom-ssr = { path = "../bloom-ssr" }
futures-executor = { version = "0.3.34", features = ["thread-pool"] }
tokio = { version = "1.54.1", features = ["macros", "rt"] }
