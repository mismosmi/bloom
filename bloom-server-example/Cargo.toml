[package]
name = "bloom-server-example"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bloom-client.workspace = true
bloom-core.workspace = true
bloom-html.workspace = true
bloom-rsx.workspace = true
bloom-ssr.workspace = true
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
wasm-bindgen = "0.2.129"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
