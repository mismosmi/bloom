[package]
name = "bloom-server-example"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bloom-client = { version = "0.1.0", path = "../bloom-client" }
bloom-core = { version = "0.1.0", path = "../bloom-core" }
bloom-html = { version = "0.1.0", path = "../bloom-html" }
bloom-rsx = { version = "0.1.0", path = "../bloom-rsx" }
bloom-ssr = { version = "0.1.0", path = "../bloom-ssr" }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
wasm-bindgen = "0.2.129"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
