[package]
name = "bloom-ssr"
version.workspace = true
edition.workspace = true
authors = ["Michel Smola <dev@michelsmola.de>"]
license = "MIT"
description = "Server-side rendering for bloom-html"
repository = "https://github.com/mismosmi/bloom/tree/main/bloom-ssr"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bloom-html.workspace = true
bloom-core.workspace = true
futures-util = { version = "0.3.34", features = ["channel"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
bloom-rsx.workspace = true
futures-executor = { version = "0.3.34", features = ["thread-pool"] }
