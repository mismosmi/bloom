[package]
name = "bloom-macos"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
bloom-core = { path = "../../bloom-core" }
async-channel = "2.5.0"
futures-util = "0.3"
weak-table = "0.4.0"
taffy = "0.15"
futures-executor = { version = "0.3", features = ["thread-pool"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
dispatch2 = "0.3"

[dev-dependencies]
bloom-rsx = { path = "../../bloom-rsx" }
futures-executor = { version = "0.3", features = ["thread-pool"] }
async-trait = "0.1"
