name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Find wasm-bindgen version
        run: echo "WASM_BINDGEN_VERSION=$(cargo pkgid wasm-bindgen | cut -d@ -f2)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      # bloom-server-example embeds the client bundle from pkg/
      - name: Build server example bundle
        run: |
          cargo build --target wasm32-unknown-unknown -p bloom-server-example --lib
          wasm-bindgen --target web --out-dir bloom-server-example/pkg target/wasm32-unknown-unknown/debug/bloom_server_example.wasm
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (wasm)
        run: cargo clippy --target wasm32-unknown-unknown -p bloom-client -p bloom-client-example -p bloom-server-example --lib -- -D warnings
      - name: Test
        run: cargo test --workspace
