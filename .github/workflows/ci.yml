name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # bloom-server-example embeds the wasm-pack output from pkg/, so it is only built for wasm here
      - name: Test
        run: cargo test --workspace --exclude bloom-server-example
      - name: Build wasm
        run: cargo build --target wasm32-unknown-unknown -p bloom-client -p bloom-client-example -p bloom-server-example --lib
