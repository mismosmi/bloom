[package]
name = "bloom-html"
version.workspace = true
edition = "2021"
authors = ["Michel Smola <dev@michelsmola.de>"]
license = "MIT"
description = "Provides the HtmlNode type for bloom-client and bloom-server"
repository = "https://github.com/mismosmi/bloom/tree/main/bloom-html"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bloom-core.workspace = true
web-sys = { version = "0.3", features = ["Event", "HtmlElement"] }

[dev-dependencies]
bloom-rsx.workspace = true
async-trait = "0.1.92"
futures-executor = { version = "0.3.34", features = ["thread-pool"] }
bloom-ssr.workspace = true
