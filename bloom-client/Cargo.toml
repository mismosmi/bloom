[package]
name = "bloom-client"
version.workspace = true
edition = "2021"
authors = ["Michel Smola <dev@michelsmola.de>"]
description = "Client-side rendering for bloom-core"
license = "MIT"
repository = "https://github.com/mismosmi/bloom/tree/main/bloom-client"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-channel = "2.5.0"
bloom-core.workspace = true
bloom-html.workspace = true
futures-util = "0.3.34"
wasm-bindgen-futures = "0.4.79"
weak-table = "0.4.0"
web-sys = { version = "0.3", features = [
    "HtmlElement",
    "Node",
    "Document",
    "Window",
    "Text",
    "NamedNodeMap",
    "Attr",
    "NodeList",
    "console",
    "Comment",
] }

[dev-dependencies]
async-trait = "0.1.92"
bloom-rsx.workspace = true
wasm-bindgen = "0.2.129"
wasm-bindgen-test = "0.3.79"
