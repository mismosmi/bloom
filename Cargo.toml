[workspace]
members = [
    "async-context",
    "bloom-core",
    "bloom-html",
    "bloom-ssr",
    "bloom-client",
    "bloom-client-example",
    "bloom-server-example",
    "bloom-rsx",
    "bloom-macro",
]
resolver = "2"

[workspace.package]
version = "0.2.0"

[workspace.dependencies]
async-context = { path = "async-context" }
bloom-client = { path = "bloom-client" }
bloom-core = { path = "bloom-core" }
bloom-html = { path = "bloom-html" }
bloom-macro = { path = "bloom-macro" }
bloom-rsx = { path = "bloom-rsx" }
bloom-ssr = { path = "bloom-ssr" }
